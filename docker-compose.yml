services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
  chromadb:
    image: chromadb/chroma:1.5.9
    environment:
      CHROMA_PERSIST_PATH: /data
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/api/v2/heartbeat]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ecommerce_agent
      CHROMA_MODE: server
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_DIR: /app/storage/chroma_db
      AMAZON_META_PATH: /app/data/meta_Amazon_Fashion.jsonl
      AMAZON_REVIEWS_PATH: /app/data/Amazon_Fashion.jsonl
      HF_HOME: /app/model-cache
      APP_WARMUP_ENABLED: "false"
      AGENT_TRACING_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker}
    volumes:
      - ./data:/app/data:ro
      - model-cache:/app/model-cache
      - ingestion-state:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"
volumes:
  mongo-data:
  chroma-data:
  model-cache:
  ingestion-state:
